[project]
name = "ai-serving-lab"
version = "0.1.0"
description = "AI 서빙 엔지니어링 학습 실습"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.5",
    "transformers>=4.46",
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ipykernel>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/servlab"]

[tool.pytest.ini_options]
testpaths = ["phases"]
# phase마다 같은 이름의 실습 파일(ex1_*.py 등)이 생겨도 충돌하지 않게 한다
addopts = "--import-mode=importlib"
markers = [
    "slow: 모델을 실제로 띄우는 테스트 (uv run pytest -m 'not slow' 로 건너뛰기)",
]
